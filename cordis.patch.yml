# dsh-minimax-image —— DSH bundle patch
#
# 这是插件的挂载声明：DSH 按 profile 的 dsh.profile.bundles 顺序叠加各 bundle 的
# patch，本文件把「出图」面板与 minimax_image 工具插入配置树。
#
# 安装（三选一）：
#   dsh plugin --profile desktop add https://github.com/zhaoyueshen/dsh-plugin-minimax-h3
#   dsh plugin --profile desktop add link:<本目录绝对路径>      # 本地开发
#   dsh plugin --profile desktop add dsh-minimax-image          # 发布到 npm 后
#
# 卸载：
#   dsh plugin --profile desktop remove dsh-minimax-image
- insert:
    - id: dsh-minimax-image
      name: dsh-minimax-image
